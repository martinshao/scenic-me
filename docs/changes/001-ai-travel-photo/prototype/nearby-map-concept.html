<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scenic Me · 附近地图方向草稿</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#17343d;background:#e9f6f4;--mint:#69cfbd;--pale:#dff6f1;--sky:#5d9fda;--ink:#17343d;--muted:#6c858a;--line:#cae2df;--white:#fff;--coral:#ff7566}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:22px 16px 44px;background:radial-gradient(circle at 12% 10%,#c9eeee,transparent 30%),#e9f6f4}button,input{font:inherit}button{cursor:pointer}.toolbar{width:min(100%,720px);margin:0 auto 16px}.toolbar h1{margin:0 0 6px;font-size:22px}.toolbar p{margin:0;color:var(--muted);line-height:1.5}.phone{position:relative;width:min(100%,393px);height:820px;margin:auto;overflow:hidden;background:#dff0e8;border:7px solid var(--ink);border-radius:42px;box-shadow:0 28px 70px rgba(32,88,97,.22)}.phone:before{content:"";position:absolute;z-index:20;top:9px;left:50%;width:92px;height:25px;transform:translateX(-50%);background:var(--ink);border-radius:20px}.map{position:absolute;inset:0;background:#e5efe0}.map svg{width:100%;height:100%}.water{fill:#a9dce5}.land{fill:#dcebd4}.park{fill:#b9ddb0}.road{fill:none;stroke:#f9fbf7;stroke-width:16}.road.minor{stroke-width:7}.route{fill:none;stroke:#5daede;stroke-width:3;stroke-dasharray:9 8}.label{font:700 15px sans-serif;fill:#5b8b76}.map-credit{position:absolute;right:14px;bottom:108px;padding:5px 8px;color:#71898d;background:rgba(255,255,255,.82);border-radius:8px;font-size:10px}.top{position:absolute;z-index:4;top:46px;right:16px;left:16px;display:grid;grid-template-columns:48px 1fr 48px;gap:9px}.round,.back{width:48px;height:48px;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-radius:50%;box-shadow:0 7px 20px rgba(39,91,99,.13)}.search{height:52px;display:flex;align-items:center;gap:9px;padding:0 12px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-radius:18px;box-shadow:0 7px 20px rgba(39,91,99,.13)}.city-trigger{display:flex;align-items:center;gap:3px;padding:7px 8px;color:var(--ink);background:var(--pale);border:0;border-radius:10px;white-space:nowrap}.city-trigger span{color:#438f84;font-size:11px}.search>.placeholder{overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.filters{position:absolute;z-index:4;top:109px;left:16px;right:16px;display:flex;gap:8px;overflow:hidden}.chip{min-height:42px;padding:8px 13px;color:var(--ink);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:14px;white-space:nowrap}.chip.active{color:#fff;background:#2f877a;border-color:#2f877a}.marker{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;padding:7px;background:rgba(255,255,255,.95);border:0;border-radius:18px;box-shadow:0 8px 22px rgba(35,84,91,.2)}.marker img{width:48px;height:58px;object-fit:cover;border-radius:13px}.marker span{display:block;text-align:left}.marker strong{display:block;font-size:12px}.marker small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.marker:after{content:"";position:absolute;bottom:-8px;left:25px;width:12px;height:12px;background:var(--coral);border:3px solid #fff;border-radius:50%}.m1{top:240px;left:83px}.m2{top:365px;right:18px}.m3{top:520px;left:20px}.marker.selected{outline:3px solid var(--mint)}.locate{position:absolute;z-index:4;right:18px;top:170px}.sheet{position:absolute;z-index:6;right:16px;bottom:24px;left:16px;padding:14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:25px;box-shadow:0 18px 44px rgba(34,84,92,.22);backdrop-filter:blur(18px)}.sheet-main{display:grid;grid-template-columns:92px 1fr 46px;gap:13px;align-items:center}.sheet img{width:92px;height:112px;object-fit:cover;border-radius:19px}.meta{color:#438f84;font-size:12px}.sheet h2{margin:7px 0 5px;font-size:22px}.sheet p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.go{width:46px;height:46px;color:#fff;background:var(--coral);border:0;border-radius:50%;font-size:24px}.flow-title{position:absolute;z-index:4;top:165px;left:16px;padding:7px 10px;color:#315f5a;background:rgba(255,255,255,.9);border-radius:12px;font-size:11px}.picker-layer{position:absolute;z-index:30;inset:0;display:grid;align-items:end;padding:16px;background:rgba(15,43,49,.38);backdrop-filter:blur(3px)}.picker-layer[hidden]{display:none}.city-panel{padding:20px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 50px rgba(23,52,61,.28)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-head h2{margin:0;font-size:21px}.close{width:38px;height:38px;color:var(--ink);background:var(--pale);border:0;border-radius:50%;font-size:20px}.use-location{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;background:#2f877a;border:0;border-radius:17px;font-weight:700}.city-panel h3{margin:18px 0 9px;font-size:14px}.city-form{display:grid;grid-template-columns:1fr 70px;gap:8px}.city-form input{min-width:0;height:46px;padding:0 13px;color:var(--ink);background:#f5faf9;border:1px solid var(--line);border-radius:13px}.city-form button{color:var(--ink);background:var(--pale);border:1px solid var(--line);border-radius:13px}.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.city-option{min-height:42px;color:var(--ink);background:#f5faf9;border:1px solid var(--line);border-radius:12px}.privacy-note{margin:14px 0 0;color:var(--muted);font-size:11px;line-height:1.5}@media(max-width:430px){body{padding:0}.toolbar{display:none}.phone{width:100%;height:100dvh;border:0;border-radius:0}.phone:before{display:none}.top{top:max(16px,env(safe-area-inset-top))}}button:focus-visible,input:focus-visible{outline:3px solid #17343d;outline-offset:2px}
  </style>
</head>
<body>
  <section class="toolbar"><h1>附近地图 · 方案 A 交互草稿</h1><p>点击地图顶部“杭州”体验定位与手动选城。地图、距离、光线与机位均为模拟。</p></section>
  <main class="phone" id="phone">
    <div class="map" aria-label="西湖附近场景示意地图">
      <svg viewBox="0 0 393 820" role="img" aria-label="非真实地图数据的西湖示意图"><path class="land" d="M0 0h393v820H0z"/><path class="water" d="M113 116c80 24 139 7 204 52 62 43 61 122 33 178-34 68-8 139-47 213-39 75-116 89-185 60-80-34-117-113-93-190 22-70 60-112 50-184-8-55-5-109 38-129z"/><path class="park" d="M0 122c62-34 121-25 152 13-45 48-66 116-47 190-58 25-77 78-105 108zM301 507c34-18 66-21 92-8v321h-97c-11-99-19-197 5-313z"/><path class="road" d="M-12 88c92 52 187 52 417-10M-18 704c116-89 247-85 424-47M335-10c-37 130-28 247 58 336"/><path class="road minor" d="M-8 515c119-32 178-13 258 60M32 0c-10 138 13 209 55 280"/><path class="route" d="M58 334c91 42 191 15 285-62M87 606c49-25 129-33 208-2"/><text class="label" x="136" y="442">西湖 · WEST LAKE</text></svg>
    </div>
    <div class="top"><button class="back" aria-label="返回">‹</button><div class="search"><button class="city-trigger" id="cityTrigger" data-open-city aria-haspopup="dialog"><strong id="cityName">杭州</strong><span aria-hidden="true">⌄</span></button><span class="placeholder">搜索景点或区域</span></div><button class="round" data-open-city aria-label="选择或定位城市">⌖</button></div>
    <div class="filters"><button class="chip active">推荐 · 4</button><button class="chip">自然风光</button><button class="chip">城市地标</button></div>
    <span class="flow-title">为本次创作选择场景</span>
    <button class="round locate" data-open-city aria-label="选择或定位城市">◎</button>
    <button class="marker m1 selected" data-scene="雷峰塔 · 夕照"><img src="assets/west-lake-travel-portrait.png" alt=""><span><strong>雷峰塔</strong><small>夕照 · 3 机位</small></span></button>
    <button class="marker m2" data-scene="西湖游船"><img src="assets/west-lake-travel-portrait.png" alt=""><span><strong>西湖游船</strong><small>自然 · 2 机位</small></span></button>
    <button class="marker m3" data-scene="曲院风荷"><img src="assets/west-lake-travel-portrait.png" alt=""><span><strong>曲院风荷</strong><small>自然 · 1 机位</small></span></button>
    <span class="map-credit">示意地图 · 非真实数据</span>
    <section class="sheet"><div class="sheet-main"><img src="assets/west-lake-travel-portrait.png" alt="选中场景示例"><div><span class="meta" id="sceneMeta">当前位置 · 约 1.2 KM · 3 个机位</span><h2 id="scene">雷峰塔 · 夕照</h2><p>现在适合侧逆光，选择后继续添加肖像。</p></div><button class="go" aria-label="使用这个场景">→</button></div></section>
    <div class="picker-layer" id="cityPicker" hidden><section class="city-panel" role="dialog" aria-modal="true" aria-labelledby="cityTitle"><div class="panel-head"><h2 id="cityTitle">选择城市</h2><button class="close" id="closePicker" aria-label="关闭城市选择">×</button></div><button class="use-location" data-locate>◎ 定位当前城市</button><h3>手动选择城市</h3><form class="city-form" id="cityForm"><input id="cityInput" placeholder="输入城市名称" aria-label="城市名称"><button type="submit">确定</button></form><h3>常用城市</h3><div class="city-grid"><button class="city-option" data-city="杭州">杭州</button><button class="city-option" data-city="上海">上海</button><button class="city-option" data-city="北京">北京</button><button class="city-option" data-city="成都">成都</button><button class="city-option" data-city="西安">西安</button><button class="city-option" data-city="厦门">厦门</button></div><p class="privacy-note">手动选城无需定位权限；只有主动选择定位时才会请求权限。</p></section></div>
  </main>
  <script>
    const scene=document.getElementById('scene'),sceneMeta=document.getElementById('sceneMeta'),cityName=document.getElementById('cityName'),cityPicker=document.getElementById('cityPicker'),cityInput=document.getElementById('cityInput');
    function openPicker(){cityPicker.hidden=false;document.getElementById('closePicker').focus()}
    function closePicker(){cityPicker.hidden=true;document.getElementById('cityTrigger').focus()}
    function chooseCity(value,located=false){cityName.textContent=value;sceneMeta.textContent=located?'当前位置 · 约 1.2 KM · 3 个机位':'城市浏览 · 距离需开启定位 · 3 个机位';closePicker()}
    document.querySelectorAll('[data-open-city]').forEach(button=>button.addEventListener('click',openPicker));
    document.getElementById('closePicker').addEventListener('click',closePicker);
    cityPicker.addEventListener('click',event=>{if(event.target===cityPicker)closePicker()});
    document.querySelectorAll('[data-city]').forEach(button=>button.addEventListener('click',()=>chooseCity(button.dataset.city)));
    document.querySelectorAll('[data-locate]').forEach(button=>button.addEventListener('click',()=>chooseCity('杭州',true)));
    document.getElementById('cityForm').addEventListener('submit',event=>{event.preventDefault();const value=cityInput.value.trim();if(value)chooseCity(value)});
    document.querySelectorAll('[data-scene]').forEach(marker=>marker.addEventListener('click',()=>{document.querySelectorAll('[data-scene]').forEach(item=>item.classList.remove('selected'));marker.classList.add('selected');scene.textContent=marker.dataset.scene}));
    if(new URLSearchParams(location.search).get('city')==='open')openPicker();
  </script>
</body>
</html>
