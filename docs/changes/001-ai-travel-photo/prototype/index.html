<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenic Me 视觉草稿</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;--paper:#dff3f2;--surface:#f7fcfb;--surface-2:#ffffff;--surface-3:#e6f5f3;--ink:#17343d;--muted:#657f85;--line:#cfe4e2;--forest:#69cfbd;--mist:#e6f5f3;--lake:#5d9fda;--gold:#d6f7ef;--danger:#c95d5d;--white:#fff;--on-accent:#12383d}
    *{box-sizing:border-box}html{background:var(--paper)}body{min-height:100vh;margin:0;padding:24px 16px 52px;color:var(--ink);background:radial-gradient(circle at 18% 12%,rgba(123,210,220,.38),transparent 30%),linear-gradient(145deg,#eefbf8,#d8eef8)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--lake);outline-offset:3px}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .tools{width:min(100%,680px);margin:0 auto 18px;color:var(--ink)}.tools h1{margin:0 0 5px;font-size:21px;line-height:1.3}.tools p{margin:0 0 12px;color:var(--muted)}.cases{display:flex;flex-wrap:wrap;gap:8px}.case{min-height:44px;padding:9px 14px;color:var(--ink);background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:14px}.case[aria-pressed="true"]{color:var(--on-accent);background:#9de6d8;border-color:#79d4c3}
    .phone{position:relative;width:min(100%,393px);height:820px;margin:auto;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 100% 0,rgba(123,210,220,.22),transparent 34%),var(--surface);border:7px solid #17343d;border-radius:42px;box-shadow:0 28px 90px rgba(41,98,109,.22)}.phone:before{content:"";position:absolute;z-index:20;top:9px;left:50%;width:92px;height:25px;transform:translateX(-50%);background:#17343d;border-radius:20px;pointer-events:none}.screen{height:100%;overflow-y:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.root-page{min-height:100%;padding:47px 18px 112px}.flow-page{min-height:100%;display:flex;flex-direction:column;padding:42px 20px 26px}
    .topbar,.flow-top{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}.flow-top{display:grid;grid-template-columns:44px 1fr 44px;text-align:center}.flow-top strong{font-size:15px}.wordmark{font-size:22px;font-weight:750;line-height:1.15;letter-spacing:-.02em}.wordmark em{color:#3ea997;font-style:normal}.location{display:flex;align-items:center;gap:5px;margin-top:4px;color:var(--muted);font-size:13px}.location .icon{width:15px;height:15px}.icon-button{width:44px;height:44px;display:grid;place-items:center;padding:0;color:var(--ink);background:transparent;border:0;border-radius:50%}.avatar{overflow:hidden;background:linear-gradient(145deg,#b8eee4,#add8f5);border:2px solid var(--white);box-shadow:0 5px 16px rgba(55,120,129,.18)}.avatar img{width:100%;height:100%;object-fit:cover;object-position:52% 20%}h2{margin:18px 0 7px;font-size:28px;font-weight:730;line-height:1.14;letter-spacing:-.035em}h3{margin:0;font-size:16px}.intro{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.55}
    .hero{position:relative;min-height:300px;margin:22px 0 18px;overflow:hidden;color:var(--ink);background:linear-gradient(135deg,#e6faf5,#dceefb);border:1px solid #bfe6e1;border-radius:26px;box-shadow:0 16px 38px rgba(61,126,137,.15)}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero .photo{left:38%;width:62%;object-position:52% 43%;filter:saturate(.72) contrast(.92) brightness(1.08)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(241,253,250,.99) 0%,rgba(236,250,247,.93) 42%,rgba(232,248,247,.15) 77%),linear-gradient(0deg,rgba(221,244,241,.28),transparent 55%)}.hero-copy{position:absolute;z-index:2;right:18px;bottom:20px;left:20px}.stamp{display:inline-flex;align-items:center;gap:5px;margin-bottom:10px;padding:6px 10px;color:#286c67;background:rgba(255,255,255,.75);border:1px solid #a7d8d2;border-radius:999px;font-size:12px;backdrop-filter:blur(10px)}.stamp .icon{width:14px;height:14px}.hero h2{max-width:225px;margin:0 0 15px;color:var(--ink);font-size:27px}.hero-action{min-height:46px;padding:11px 17px;color:var(--on-accent);background:#a9eadf;border:0;border-radius:999px;font-weight:700;box-shadow:0 8px 20px rgba(55,134,130,.17)}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 12px}.section-head strong{font-size:19px;font-weight:720;line-height:1.2}.section-head span{color:#4789c3;font-size:12px}.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{position:relative;min-height:154px;overflow:hidden;padding:15px;color:var(--ink);text-align:left;background:linear-gradient(145deg,#fff,#f1faf8);border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 24px rgba(62,120,128,.09)}.tile:before{content:"";position:absolute;top:-42px;right:-35px;width:108px;height:108px;background:radial-gradient(circle,rgba(111,191,225,.16),transparent 66%)}.tile .photo{display:none}.tile>span{position:relative;z-index:1;display:block}.tile-kicker{width:42px;height:42px;display:grid!important;place-items:center;margin-bottom:26px;color:#318f82;background:#dcf5ef;border-radius:14px}.tile-kicker .icon{width:23px;height:23px}.tile-title{font-size:17px;font-weight:700;line-height:1.25}.tile-note{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.45}
    .bottom-nav{position:absolute;z-index:12;right:12px;bottom:10px;left:12px;min-height:76px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 10px 10px;background:rgba(255,255,255,.91);border:1px solid rgba(166,211,207,.75);border-radius:24px;box-shadow:0 16px 34px rgba(50,105,115,.16);backdrop-filter:blur(20px)}.nav-item{position:relative;min-height:52px;display:grid;place-items:center;align-content:center;gap:4px;padding:4px;color:#789096;background:transparent;border:0;border-radius:18px;font-size:11px}.nav-item .icon{width:22px;height:22px}.nav-item[aria-current="page"]{color:var(--on-accent);background:linear-gradient(145deg,#a5e8dc,#bce8f8);box-shadow:0 8px 22px rgba(76,178,169,.2)}
    .progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0 22px}.progress span{height:3px;background:var(--line);border-radius:3px}.progress span.done{background:var(--forest)}.stack{display:grid;gap:10px}.choice{width:100%;min-height:76px;display:flex;align-items:center;gap:12px;padding:13px;color:var(--ink);text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:18px}.choice.selected{border:2px solid var(--forest);background:var(--surface-3)}.thumb{width:54px;height:54px;flex:0 0 auto;overflow:hidden;background:var(--surface-3);border-radius:14px}.thumb img{width:100%;height:100%;object-fit:cover}.choice-copy{flex:1}.choice-copy strong,.choice-copy small{display:block}.choice-copy small{margin-top:4px;color:var(--muted)}
    .primary{width:100%;min-height:52px;padding:12px 16px;color:var(--on-accent);background:linear-gradient(135deg,#91dfd1,#acdff4);border:0;border-radius:18px;font-weight:700;box-shadow:0 8px 20px rgba(64,147,144,.14)}.secondary{min-height:48px;padding:11px 14px;color:#2c8277;background:var(--surface-2);border:1px solid #8bd3c7;border-radius:16px}.ghost{min-height:44px;padding:9px;color:#2c8277;background:transparent;border:0}button:active{filter:brightness(.94)}button:disabled{cursor:not-allowed;opacity:.38}.footer{margin-top:auto;padding-top:20px}.notice{margin:13px 0;padding:13px 14px;color:var(--ink);background:#e8f5f8;border-left:3px solid var(--lake);border-radius:0 14px 14px 0;line-height:1.5}.notice.error{color:#8e3636;background:#fff0ef;border-color:var(--danger)}.search{width:100%;min-height:50px;margin-bottom:12px;padding:11px 13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:16px}.search::placeholder{color:#82989d}
    .stage{position:relative;min-height:255px;display:grid;place-items:center;margin:8px 0 14px;overflow:hidden;color:var(--muted);text-align:center;background:var(--surface-2);border:1px dashed var(--lake);border-radius:24px}.stage.ready{color:var(--white);border-style:solid}.stage.ready:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(4,24,37,.86))}.stage-label{position:relative;z-index:2;align-self:end;width:100%;padding:16px;text-align:left}.check{display:flex;align-items:flex-start;gap:10px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.45}.check input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--forest)}
    .styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.style{position:relative;aspect-ratio:1/1.18;overflow:hidden;color:var(--white);text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:20px}.style img{width:100%;height:100%;object-fit:cover}.style:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(4,24,37,.9))}.style.selected{border-color:var(--forest)}.style span{position:absolute;z-index:2;right:12px;bottom:12px;left:12px;font-weight:650}.film img{filter:sepia(.24) contrast(1.06)}.anime img{filter:saturate(1.55) contrast(1.08)}.fantasy img{filter:hue-rotate(25deg) saturate(1.2)}
    .summary{overflow:hidden;margin-top:10px;border-top:1px solid var(--line)}.summary-row{display:flex;justify-content:space-between;gap:16px;padding:14px 2px;border-bottom:1px solid var(--line)}.summary-row span:last-child{color:var(--muted);text-align:right}.loading{position:relative;min-height:420px;margin:14px 0;overflow:hidden;border-radius:24px}.loading img{width:100%;height:100%;object-fit:cover;filter:blur(8px) saturate(.75);transform:scale(1.05)}.loading:after{content:"正在显影";position:absolute;inset:0;display:grid;place-items:center;color:var(--white);background:rgba(7,58,72,.48);font-size:27px;font-weight:720}
    .result-hero{position:relative;height:500px;overflow:hidden;border-radius:26px}.result-hero img{width:100%;height:100%;object-fit:cover}.result-stamp{position:absolute;right:14px;bottom:14px;padding:9px 11px;color:var(--gold);background:rgba(23,52,61,.76);border:1px solid rgba(216,255,244,.65);border-radius:12px;font-size:12px;font-weight:650;line-height:1.2;backdrop-filter:blur(8px)}.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 12px}.pick{aspect-ratio:3/4;overflow:hidden;padding:0;background:var(--mist);border:2px solid transparent;border-radius:10px}.pick.selected{border-color:#51bca9}.pick img{width:100%;height:100%;object-fit:cover}.pick:nth-child(2) img{filter:sepia(.2)}.pick:nth-child(3) img{filter:saturate(1.25)}.pick:nth-child(4) img{filter:contrast(1.1) brightness(.92)}.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:10px}.ai-label,.status{min-height:22px;margin-top:9px;color:var(--muted);font-size:12px;text-align:center}
    .inspiration{position:relative;height:390px;margin-top:18px;overflow:hidden;border:1px solid rgba(143,227,209,.2);border-radius:26px}.inspiration img{width:100%;height:100%;object-fit:cover}.inspiration:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(5,25,39,.9))}.inspiration-copy{position:absolute;z-index:2;right:18px;bottom:18px;left:18px;color:var(--white)}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.gallery figure{margin:0}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px}.gallery figcaption{margin-top:7px;color:var(--muted);font-size:12px}.profile-list{overflow:hidden;margin-top:20px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px}.profile-row{width:100%;min-height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line)}.profile-row:last-child{border-bottom:0}
    .phone.narrow{width:375px}.phone.narrow .root-page{padding-inline:16px}.phone.narrow .task-grid{gap:8px}.phone.narrow .tile{padding:13px}.phone.narrow .tile-title{font-size:16px}@media(max-width:430px){body{padding:0;background:var(--surface)}.tools{display:none}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.phone:before{display:none}.root-page,.flow-page{padding-top:max(18px,env(safe-area-inset-top))}.bottom-nav{bottom:max(10px,env(safe-area-inset-bottom))}}@media(max-width:360px){.root-page{padding-inline:14px}.task-grid{gap:8px}.tile{padding:13px}.tile-title{font-size:16px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol><symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol><symbol id="i-images" viewBox="0 0 24 24"><rect x="3" y="4" width="16" height="16" rx="2"/><path d="m7 15 3-3 2 2 2-2 5 5M8 8h.01"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <section class="tools"><h1>Scenic Me · 视觉草稿</h1><p>底部导航用于一级页面；进入创作流程后隐藏，避免中途误触。</p><div class="cases"><button class="case" data-case="normal" aria-pressed="true">正常流程</button><button class="case" data-case="location-denied" aria-pressed="false">定位被拒绝</button><button class="case" data-case="generation-failed" aria-pressed="false">首次生成失败</button></div></section>
  <main class="phone" id="phone" aria-live="polite"></main>
  <script>
    const phone=document.getElementById('phone'),image='assets/west-lake-travel-portrait.png';
    if(new URLSearchParams(location.search).get('viewport')==='narrow')phone.classList.add('narrow');
    const state={page:'home',step:'home',mode:'',scene:'',portrait:false,authorized:false,style:'自然写真',testCase:'normal',locationState:'prompt',failedOnce:false,selectedResult:1,message:''};
    const modeNames={memory:'修复旅行回忆',nearby:'发现附近打卡点',virtual:'虚拟去一个地方'};
    const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
    function reset(testCase=state.testCase){Object.assign(state,{page:'home',step:'home',mode:'',scene:'',portrait:false,authorized:false,style:'自然写真',testCase,locationState:'prompt',failedOnce:false,selectedResult:1,message:''});render()}
    function nav(active){return `<nav class="bottom-nav" aria-label="主导航">${[['home','home','首页'],['inspire','compass','灵感'],['works','images','作品'],['profile','user','我的']].map(([p,i,l])=>`<button class="nav-item" data-tab="${p}" ${active===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav>`}
    function home(){return `<section class="screen"><div class="root-page"><div class="topbar"><div><div class="wordmark">你好，旅行者</div><div class="location">今天想留下哪一段旅程？</div></div><button class="icon-button avatar" data-tab="profile" aria-label="打开我的"><img src="${image}" alt=""></button></div><article class="hero"><img class="photo" src="${image}" alt="西湖夕阳旅行写真示例"><div class="hero-copy"><span class="stamp">${icon('pin')}杭州 · 西湖</span><h2>把旅途里没拍好的，重新拍好</h2><button class="hero-action" data-mode="memory">从风景照开始</button></div></article><div class="section-head"><strong>选择一种创作方式</strong><span>无需写 Prompt</span></div><div class="task-grid"><button class="tile nearby" data-mode="nearby"><span class="tile-kicker">${icon('pin')}</span><span class="tile-title">发现附近打卡点</span><span class="tile-note">根据定位推荐景点与合适机位</span></button><button class="tile virtual" data-mode="virtual"><span class="tile-kicker">${icon('compass')}</span><span class="tile-title">虚拟去一个地方</span><span class="tile-note">搜索目的地，生成新的旅行视角</span></button></div></div>${nav('home')}</section>`}
    function rootPage(p){if(p==='inspire')return `<section class="screen"><div class="root-page"><div class="topbar"><div><div class="wordmark">灵感</div><div class="location">目的地与风格</div></div>${icon('compass')}</div><article class="inspiration"><img src="${image}" alt="西湖自然写真灵感"><div class="inspiration-copy"><span class="stamp">本周精选</span><h2>西湖，把黄昏留得更久</h2><button class="hero-action" data-mode="virtual">用这个灵感创作</button></div></article><div class="section-head"><strong>氛围收藏</strong><span>自然 · 胶片 · 奇幻</span></div></div>${nav('inspire')}</section>`;if(p==='works')return `<section class="screen"><div class="root-page"><div class="topbar"><div><div class="wordmark">我的作品</div><div class="location">旅行回忆与草稿</div></div></div><div class="gallery"><figure><img src="${image}" alt="西湖旅行写真作品"><figcaption>西湖 · 自然写真</figcaption></figure><figure><img src="${image}" style="filter:sepia(.25)" alt="电影胶片风格草稿"><figcaption>未完成 · 电影胶片</figcaption></figure></div><div class="notice">生成中的作品也会保存在这里。</div></div>${nav('works')}</section>`;return `<section class="screen"><div class="root-page"><div class="topbar"><div><div class="wordmark">我的</div><div class="location">偏好与数据</div></div><button class="icon-button avatar">${icon('user')}</button></div><div class="profile-list">${['肖像照片　1 张','创作草稿　1 个','隐私与数据删除','生成内容标识　已开启'].map(x=>`<button class="profile-row"><span>${x}</span><span>›</span></button>`).join('')}</div></div>${nav('profile')}</section>`}
    function flowTop(t,n=0){return `<div class="flow-top"><button class="icon-button" data-action="back" aria-label="返回">${icon('back')}</button><strong>${t}</strong><button class="icon-button" data-action="home" aria-label="退出创作">${icon('close')}</button></div>${n?`<div class="progress" aria-label="进度 ${n}/4">${[1,2,3,4].map(i=>`<span class="${n>=i?'done':''}"></span>`).join('')}</div>`:''}`}
    function scene(){let b='';if(state.mode==='memory')b=`<div class="stage ${state.scene?'ready':''}">${state.scene?`<img class="photo" src="${image}" alt="已选择的风景照"><span class="stage-label">西湖暮色.jpg</span>`:'<span>上传你当时拍摄的风景照</span>'}</div><button class="secondary" data-action="pick-memory">${state.scene?'重新选择':'选择照片'}</button>`;else if(state.mode==='virtual')b=`<label for="destination">搜索目的地</label><input class="search" id="destination" placeholder="例如：富士山、巴黎铁塔"><div class="stack">${['富士山·湖畔新视角','巴黎·雨夜电影感'].map(x=>`<button class="choice ${state.scene===x?'selected':''}" data-scene="${x}"><span class="thumb"><img src="${image}" alt=""></span><span class="choice-copy"><strong>${x}</strong><small>AI 重构场景</small></span></button>`).join('')}</div>`;else if(state.locationState==='prompt')b=`<div class="notice"><strong>只在这一步使用定位</strong><br>拒绝后仍可搜索或上传。</div><div class="stack"><button class="primary" data-action="allow-location">允许本次定位</button><button class="secondary" data-action="skip-location">跳过定位</button></div>`;else{const denied=state.locationState==='denied';b=`${denied?'<div class="notice error"><strong>没有获得定位</strong><br>继续搜索地点或上传风景照。</div>':'<p class="intro">找到 6 个附近景点，按光线与距离排序。</p>'}<input class="search" aria-label="搜索景点" placeholder="搜索景点"><div class="stack">${denied?'':`<button class="choice ${state.scene?'selected':''}" data-scene="外滩·日落"><span class="thumb"><img src="${image}" alt=""></span><span class="choice-copy"><strong>外滩 · 日落</strong><small>约 600 米 · 适合侧逆光</small></span></button>`}<button class="choice" data-scene="手动搜索的景点"><span class="thumb"></span><span class="choice-copy"><strong>搜索一个地点</strong><small>不需要定位</small></span></button><button class="choice" data-scene="上传的风景照"><span class="thumb"></span><span class="choice-copy"><strong>上传风景照</strong><small>使用当前或以前的照片</small></span></button></div>`}return `<section class="screen"><div class="flow-page">${flowTop(modeNames[state.mode],1)}<h2>先选一个场景</h2><p class="intro">我们会根据它匹配人物位置、光线与构图。</p>${b}<div class="footer"><button class="primary" data-action="to-portrait" ${state.scene?'':'disabled'}>下一步 · 添加肖像</button></div></div></section>`}
    function portrait(){return `<section class="screen"><div class="flow-page">${flowTop('添加肖像',2)}<h2>选一张像你的照片</h2><p class="intro">正面、无遮挡、光线均匀，生成效果会更自然。</p><div class="stage ${state.portrait?'ready':''}">${state.portrait?`<img class="photo" src="${image}" alt="肖像示例"><span class="stage-label">肖像已通过基础检查</span>`:'<span>尚未选择肖像</span>'}</div><button class="secondary" data-action="pick-portrait">${state.portrait?'重新选择肖像':'从相册选择'}</button><label class="check"><input type="checkbox" data-action="authorize" ${state.authorized?'checked':''}><span>我确认照片中的成年人是本人，或已同意用于本次 AI 创作。</span></label><div class="footer"><button class="primary" data-action="to-style" ${state.portrait&&state.authorized?'':'disabled'}>下一步 · 选择风格</button></div></div></section>`}
    function styles(){return `<section class="screen"><div class="flow-page">${flowTop('选择风格',3)}<h2>让这张照片有情绪</h2><p class="intro">默认保留真实感，也可以大胆改变画面语言。</p><div class="styles">${['自然写真','电影胶片','动漫旅行','奇幻大片'].map((x,i)=>`<button class="style ${state.style===x?'selected':''} ${['','film','anime','fantasy'][i]}" data-style="${x}"><img src="${image}" alt="${x}示例"><span>${x}</span></button>`).join('')}</div><div class="footer"><button class="primary" data-action="to-review">下一步 · 确认生成</button></div></div></section>`}
    function review(){return `<section class="screen"><div class="flow-page">${flowTop('确认生成',4)}<h2>准备重新遇见这一刻</h2><p class="intro">原始照片不会被修改。</p><div class="summary">${[['方式',modeNames[state.mode]],['场景',state.scene],['肖像','已确认'],['风格',state.style]].map(x=>`<div class="summary-row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><div class="notice">本次会生成 4 张候选，供你比较构图和氛围。</div><div class="footer"><button class="primary" data-action="generate">开始生成</button><button class="ghost" data-action="back">返回修改风格</button></div></div></section>`}
    function loading(){return `<section class="screen"><div class="flow-page">${flowTop('生成中')}<div class="loading"><img src="${image}" alt="正在处理的照片"></div><p class="intro" style="text-align:center">正在匹配人物、光线与场景。离开后会继续生成。</p><div class="footer"><button class="secondary" data-action="home">返回首页，后台继续</button></div></div></section>`}
    function failed(){return `<section class="screen"><div class="flow-page">${flowTop('生成未完成')}<div class="stage"><span>这次没有完成显影</span></div><h2>设置已经为你保留</h2><p class="intro">生成服务暂时不可用，重试不需要重新选图。</p><div class="footer stack"><button class="primary" data-action="generate">使用原设置重试</button><button class="secondary" data-action="to-style">调整风格</button></div></div></section>`}
    function results(){return `<section class="screen"><div class="flow-page">${flowTop('生成结果')}<h2>这一张，像你记得的旅途吗？</h2><div class="result-hero"><img src="${image}" alt="选中的西湖旅行写真"><span class="result-stamp">SCENIC ME<br>杭州 · 西湖</span></div><div class="picks">${[1,2,3,4].map(n=>`<button class="pick ${state.selectedResult===n?'selected':''}" data-result="${n}" aria-label="选择候选 ${n}"><img src="${image}" alt=""></button>`).join('')}</div><div class="ai-label">AI 创作 · 基于你选择的场景与肖像</div><div class="footer"><div class="actions"><button class="secondary" data-action="regenerate">再生成一组</button><button class="primary" data-action="save">保存并分享</button></div><div class="status">${state.message}</div></div></div></section>`}
    function render(){const flows={scene,portrait,style:styles,review,loading,failed,results};phone.innerHTML=state.step==='home'?(state.page==='home'?home():rootPage(state.page)):flows[state.step]()}
    function back(){const p={scene:'home',portrait:'scene',style:'portrait',review:'style',loading:'review',failed:'review',results:'review'};state.step=p[state.step]||'home';render()}
    function generate(){state.step='loading';state.message='';render();setTimeout(()=>{if(state.testCase==='generation-failed'&&!state.failedOnce){state.failedOnce=true;state.step='failed'}else state.step='results';render()},1200)}
    document.querySelector('.cases').addEventListener('click',e=>{const b=e.target.closest('[data-case]');if(!b)return;document.querySelectorAll('[data-case]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset(b.dataset.case)});
    phone.addEventListener('change',e=>{if(e.target.matches('[data-action="authorize"]')){state.authorized=e.target.checked;render()}});
    phone.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'),mode=e.target.closest('[data-mode]'),sc=e.target.closest('[data-scene]'),st=e.target.closest('[data-style]'),result=e.target.closest('[data-result]'),a=e.target.closest('[data-action]')?.dataset.action;if(tab){state.page=tab.dataset.tab;state.step='home';render();return}if(mode){state.mode=mode.dataset.mode;state.scene='';state.locationState='prompt';state.step='scene';render();return}if(sc){state.scene=sc.dataset.scene;render();return}if(st){state.style=st.dataset.style;render();return}if(result){state.selectedResult=+result.dataset.result;state.message='';render();return}if(!a)return;if(a==='back')back();if(a==='home')reset();if(a==='pick-memory'){state.scene='西湖暮色';render()}if(a==='allow-location'){state.locationState=state.testCase==='location-denied'?'denied':'ready';render()}if(a==='skip-location'){state.locationState='denied';render()}if(a==='to-portrait'&&state.scene){state.step='portrait';render()}if(a==='pick-portrait'){state.portrait=true;render()}if(a==='to-style'&&state.portrait&&state.authorized){state.step='style';render()}if(a==='to-review'){state.step='review';render()}if(a==='generate')generate();if(a==='regenerate'){state.step='review';render()}if(a==='save'){state.message=`候选 ${state.selectedResult} 已保存，导出保留 AI 标识`;render()}});
    render();
  </script>
</body>
</html>
